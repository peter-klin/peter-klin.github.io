baseURL: "https://peter-klin.github.io/"
locale: "en-US"
title: "Peter's blog"
theme: ["PaperMod"]

enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  author: "Peter Lin"
  description: "Notes on data science, AI, engineering, and things I'm learning."

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true

  ShareButtons:
    - linkedin
    - x

  showtoc: true
  tocopen: false

  homeInfoParams:
    Title: "Hi, I'm Peter 👋"
    Content: >
      I write about data science, AI, software engineering,
      and things I'm learning.

  socialIcons:
    - name: github
      url: "https://github.com/peter-klin"

    - name: linkedin
      url: "https://www.linkedin.com/in/kuan-fu-lin-737378230/"

    - name: googlescholar
      url: https://scholar.google.com/citations?user=eExOPXkAAAAJ&hl=en

    - name: kaggle
      url: https://www.kaggle.com/peterdamn

menu:
  main:
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 10

    - identifier: search
      name: Search
      url: /search/
      weight: 20

    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30

    - identifier: about
      name: About
      url: /about/
      weight: 40

caches:
  images:
    dir: ":cacheDir/images"
